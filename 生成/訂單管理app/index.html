<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#9670ae"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><meta name="referrer" content="no-referrer"><title>Timo 烘焙坊｜訂單管理</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#fff8f2;color:#3d302b;margin:0;font-size:18px}header{background:#9670ae;color:white;padding:18px}main{max-width:800px;margin:auto;padding:16px}button,input,select,textarea{font:inherit;padding:12px;border-radius:10px;border:1px solid #c9b7a9;box-sizing:border-box}button{background:#9670ae;color:white;cursor:pointer}button.secondary{background:white;color:#9670ae}input,select,textarea{width:100%;background:white}label{display:block;margin:12px 0 5px;font-weight:600}.card{background:white;border:1px solid #e4d6cc;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #00000008}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}nav{display:flex;gap:8px;margin:16px 0}nav button{flex:1}.muted{color:#74665e;font-size:15px}.hidden{display:none}.status{font-weight:bold;color:#785332}h1{margin:0;font-size:25px}h2{font-size:22px}.danger{background:#a62b2b}small{font-size:14px}
:root{color-scheme:light}*{box-sizing:border-box}body{background:#fcf7fd;color:#493c55}header{position:relative;display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,#ead8f3,#f9deea);color:#513c63;padding:20px 16px;border-bottom:1px solid #dfc5e9}header h1{font-size:24px}header .muted{margin-top:5px;color:#735e80}main{position:relative;max-width:800px;padding:16px}button{background:#8c64a5;border-color:#8c64a5;box-shadow:0 3px 9px #87629b15}button.secondary{background:#fff;color:#75508e;border-color:#d7bfe4}button:disabled{opacity:.55;cursor:wait}input,select,textarea{border-color:#dbc9e4;color:#493c55;min-width:0}input:focus,select:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:3px solid #d4afe7;outline-offset:2px}.card{border-color:#eadbee;border-radius:20px;box-shadow:0 5px 18px #8462930c}.muted{color:#7d6b88}.status{color:#88549e}nav{margin:12px 0 18px}nav button{border-radius:14px}.sync-line{font-size:14px;min-height:22px;margin:10px 2px;color:#786386}.flowers{position:absolute;right:16px;top:12px;color:#ad80bd;font-size:27px;letter-spacing:8px;pointer-events:none;opacity:.6}.flowers span{font-size:17px;color:#cf8fb3}.menu{flex:none}.menu>summary{list-style:none;cursor:pointer;font-size:27px;width:46px;height:46px;display:grid;place-items:center;background:#fff9;border:1px solid #d7bfe4;border-radius:14px}.menu>summary::-webkit-details-marker{display:none}.menu[open]:before{content:'';position:fixed;inset:0;background:#37233d55;z-index:10;pointer-events:none}.settings-panel{position:fixed;inset:0 auto 0 0;width:min(90vw,390px);height:100dvh;overflow:auto;overscroll-behavior:contain;z-index:11;background:#fcf7fd;padding:22px;padding-top:max(22px,env(safe-area-inset-top));box-shadow:8px 0 30px #49345426;color:#493c55}.settings-title{display:flex;justify-content:space-between;align-items:center;gap:12px}.settings-title h2{margin:0}.settings-title button{padding:8px 12px}.settings-panel p{line-height:1.7}.settings-panel .row>*{flex-basis:100%}.intro{font-size:14px;padding:14px;border:1px solid #eadbee;border-radius:16px;background:#fff9;line-height:1.7}.footer-note{font-size:13px;line-height:1.7;margin-top:28px}#summary{font-size:15px;color:#7d6b88}.ledger-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}.ledger-grid .big{display:block;font-size:21px;margin:4px 0;color:#5c3f70}.ledger-grid .big.neg{color:#a62b2b}.warn{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:12px;background:#fdf3e4;border:1px solid #efd9b4;font-size:15px;color:#7a5a2e}.warn .pay-btn{flex:0 0 auto;width:auto;padding:9px 18px;font-size:15px;background:#a9762a;border-color:#a9762a;box-shadow:none}.drawer-sec{margin:22px 0 0;padding-top:18px;border-top:1px solid #eadbee}.drawer-nav{display:flex;flex-direction:column;gap:10px;margin-top:18px}.drawer-nav button{width:100%;text-align:left;padding:15px 16px;font-size:18px}.drawer-nav button.on{background:#75508e;border-color:#75508e;color:#fff}.login-card{max-width:460px;margin:8px auto}.login-card h2{margin:0 0 6px}.login-card button{width:100%;margin-top:18px}.remember{display:flex;align-items:center;gap:11px;margin-top:18px}.remember input{width:auto;min-width:0;margin:0;transform:scale(1.35)}.remember label{margin:0;font-weight:500;font-size:17px}.item-block{border:1px solid #e5d4ec;border-radius:16px;padding:14px 14px 16px;margin:10px 0;background:#fdfaff}.item-block label{margin-top:10px}.item-head{display:flex;justify-content:space-between;align-items:center}.item-head span{font-weight:700;color:#75508e}.link-del{background:none;border:none;color:#a62b2b;box-shadow:none;padding:6px 4px;font-size:16px;width:auto}#addItemBtn{width:100%;margin-top:4px}.total-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 4px;padding:14px 18px;border-radius:16px;background:#f3e8f8;border:1px solid #e3d0ec}.row>.del-btn{flex:0 0 auto;width:54px;padding:12px 0;background:#fff;color:#a62b2b;border-color:#e9c7c7;font-size:19px;box-shadow:none}.sub-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:10px;border-top:1px dashed #e3d0ec}.sub-row b{font-size:18px;color:#5c3f70}.total-row span{font-size:18px;font-weight:600}.total-row b{font-size:24px;color:#5c3f70}#ledger h3{margin:24px 0 8px}@media(max-width:420px){.ledger-grid{gap:8px}.ledger-grid .big{font-size:18px}}@media(max-width:420px){header h1{font-size:21px}.flowers{right:6px;letter-spacing:2px;font-size:21px}header{gap:10px}.row{gap:8px}main{padding:14px}button,input,select,textarea{font-size:16px}}
</style></head><body><header><details class="menu" id="settingsMenu" hidden><summary aria-label="開啟選單" title="選單">☰</summary><aside class="settings-panel" aria-label="選單"><div class="settings-title"><h2>選單</h2><button class="secondary" onclick="closeSettings()" aria-label="關閉選單">✕</button></div><div class="drawer-nav"><button id="navList" onclick="go('list')">訂單清單</button><button id="navLedger" onclick="go('ledger')">收支紀錄</button><button id="navHistory" onclick="go('history')">歷史訂單</button></div><div class="drawer-sec"><button class="secondary" style="width:100%" onclick="logout()">登出</button><p class="muted">登出會清除這支手機記住的密鑰，下次需重新輸入。網址仍會保留。</p></div></aside></details><div><h1>Timo 烘焙坊</h1><div class="muted">把每一份甜蜜，細心記下</div></div><div class="flowers" aria-hidden="true">✿ <span>❀</span></div></header><main><section id="login"><article class="card login-card"><h2>連線設定</h2><p class="muted">輸入 Apps Script 網址與共用密鑰即可開始。網址會記在這支手機，下次只要輸入密鑰。</p><form id="loginForm"><label for="endpoint">Apps Script 網址</label><input id="endpoint" type="url" autocapitalize="none" spellcheck="false" placeholder="https://script.google.com/macros/s/.../exec"><label for="secret">共用密鑰</label><input id="secret" type="password" autocomplete="off" placeholder="請輸入後端設定的密鑰"><p id="secretInfo" class="muted" style="margin:6px 2px 0;min-height:22px"></p><div class="remember"><input type="checkbox" id="remember"><label for="remember">記住密鑰，下次自動登入</label></div><button type="submit">登入</button></form><p id="settingsNotice" class="muted" role="status" aria-live="polite"></p><p class="muted">密鑰不會上傳到這個網站。勾選「記住」時只存在這支手機裡，登出即清除。手機若借人或遺失，對方打開就能看到訂單。</p></article></section><p id="syncMsg" role="status" aria-live="polite" class="sync-line hidden"></p><nav id="mainNav" class="hidden"><button onclick="go('list')">訂單清單</button><button onclick="newOrder()">＋新增訂單</button></nav><section id="list"><h2 id="listTitle">訂單清單</h2><div class="row"><select id="filter" onchange="render()"><option value="">全部狀態</option><option>待確認</option><option>待付款</option><option>已成立</option><option>製作中</option><option>待交付</option><option>已完成</option><option>已取消</option></select><button class="secondary" onclick="loadOrders()">重新整理</button></div><p id="summary"></p><div id="orders"></div></section><section id="editor" class="hidden"><h2 id="formTitle">新增訂單</h2><form id="form"><input type="hidden" id="id"><label>顧客名稱 *</label><input id="customer" required maxlength="100"><label>聯絡方式（可留空）</label><input id="contact" maxlength="100"><h3 style="margin:20px 0 0">商品明細</h3><div id="items"></div><button type="button" id="addItemBtn" class="secondary" onclick="addItem()">＋ 新增商品</button><div class="total-row"><span>總金額</span><b id="orderTotal">NT$ 0</b></div><label for="due">交付日期</label><input id="due" type="date"><label>交付方式</label><select id="delivery"><option>自取</option><option>宅配</option></select><label>付款狀態</label><select id="payment"><option>未付款</option><option>部分付款</option><option>已付款</option><option>已退款</option></select><label>訂單狀態</label><select id="status"><option>待確認</option><option>待付款</option><option>已成立</option><option>製作中</option><option>待交付</option><option>已完成</option><option>已取消</option></select><label>備註／客製化需求</label><textarea id="notes" rows="3" maxlength="2000"></textarea><div class="row" style="margin-top:16px"><button type="submit">儲存訂單</button><button type="button" class="secondary" onclick="show('list')">取消</button></div></form></section><section id="ledger" class="hidden"><h2>收支紀錄</h2><div class="row"><input id="month" type="month" aria-label="記帳月份" onchange="renderLedger()"><button class="secondary" onclick="loadLedger()">重新整理</button></div><p id="ledgerMsg" class="sync-line" role="status" aria-live="polite"></p><div id="ledgerSummary"></div><h3 id="expFormTitle">新增支出</h3><form id="expForm"><input type="hidden" id="expId"><div class="row"><div><label for="expDate">日期 *</label><input id="expDate" type="date" required></div><div><label for="expCategory">分類</label><select id="expCategory"><option>材料</option><option>包材</option><option>設備</option><option>運費</option><option>其他</option></select></div></div><label for="expItem">項目 *</label><input id="expItem" required maxlength="100" placeholder="例：動物性鮮奶油 5 盒"><label for="expAmount">金額 NT$ *</label><input id="expAmount" type="number" min="0" step="1" required><label for="expNotes">備註</label><input id="expNotes" maxlength="500"><div class="row" style="margin-top:14px"><button type="submit">儲存支出</button><button type="button" class="secondary" onclick="resetExpForm()">清空欄位</button></div></form><h3>本月支出明細</h3><div id="expList"></div><h3>本月待收款</h3><div id="unpaidList"></div><div class="row" style="margin-top:22px"><button class="secondary" onclick="show('list')">回訂單清單</button></div></section><p id="verLine" class="muted" style="text-align:center;font-size:13px;margin:26px 0 0"></p><p id="footerNote" class="muted footer-note hidden">❀ 兩人一起照顧每一份訂單。另一支手機修改後，請按「重新整理」。</p></main><script>const APP_VERSION='20261114-1248';let data=[],busy=false,editingVersion='';const fields=['id','customer','contact','due','delivery','payment','status','notes'];const $=x=>document.getElementById(x);let storageAvailable=true,loggedIn=false;$('secret').value='';try{$('endpoint').value=localStorage.getItem('timoEndpoint')||'';const ss=localStorage.getItem('timoSecret')||'';if(ss){$('secret').value=ss;$('remember').checked=true}sessionStorage.removeItem('timoSecret')}catch{storageAvailable=false}
function cleanSecret(v){return String(v==null?'':v).replace(/[\u200B-\u200D\uFEFF\u00AD]/g,'').trim()}function secretReport(){const raw=$('secret').value,c=cleanSecret(raw);if(!c){$('secretInfo').textContent='';return}const f=[];if(raw!==c)f.push('已清除看不見的字元');if(/[\uFF01-\uFF5E\u3000]/.test(c))f.push('⚠️ 含全形字元');if(/\s/.test(c))f.push('⚠️ 中間有空白');else if(/[^\x20-\x7E]/.test(c))f.push('⚠️ 含非英文鍵盤字元');$('secretInfo').textContent='已輸入 '+c.length+' 字'+(f.length?'　'+f.join('　'):'');}function closeSettings(){$('settingsMenu').open=false}
function setAuth(v){loggedIn=v;$('settingsMenu').hidden=!v;if(!v)$('settingsMenu').open=false;$('login').classList.toggle('hidden',v);['syncMsg','mainNav','footerNote'].forEach(id=>$(id).classList.toggle('hidden',!v));if(!v)['list','editor','ledger'].forEach(id=>$(id).classList.add('hidden'))}function go(tab){if(busy)return;closeSettings();if(tab==='history'||tab==='list'){showHistory=(tab==='history');show('list');render()}else{show(tab);if(tab==='ledger')openLedger()}window.scrollTo(0,0)}async function login(){if(busy)return;try{config()}catch(e){$('settingsNotice').textContent=e.message;return}try{localStorage.setItem('timoEndpoint',$('endpoint').value.trim());storageAvailable=true}catch{storageAvailable=false}setBusy(true);$('settingsNotice').textContent='連線中…';try{await refreshOrders();try{if($('remember').checked)localStorage.setItem('timoSecret',cleanSecret($('secret').value));else localStorage.removeItem('timoSecret')}catch(e){}setAuth(true);show('list');$('settingsNotice').textContent=storageAvailable?'':'瀏覽器禁止保存設定，下次仍需輸入網址。'}catch(e){const m=String(e.message||'');let hint='';if(m.indexOf('授權')>=0||m.indexOf('密鑰')>=0||m.toLowerCase().indexOf('auth')>=0){hint='　網址是通的，問題出在密鑰（長度 '+cleanSecret($('secret').value).length+' 字）。請與另一支手機核對字數與大小寫。';if(/[\uFF01-\uFF5E\u3000]/.test($('secret').value))hint='　偵測到全形字元 —— 請把鍵盤切成英文（半形）再重打一次。';}$('settingsNotice').textContent='登入失敗：'+m+hint}finally{setBusy(false)}}
function logout(){if(busy)return;try{localStorage.removeItem('timoSecret')}catch(e){}$('remember').checked=false;data=[];expenses=[];backendLedger=null;editingVersion='';$('secret').value='';$('form').reset();$('expForm').reset();render();closeSettings();setAuth(false);$('settingsNotice').textContent='已登出，請重新輸入密鑰。';window.scrollTo(0,0)}function config(){const endpoint=$('endpoint').value.trim(),secret=cleanSecret($('secret').value);if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(endpoint)||!secret)throw Error('請填入正確 Apps Script 網址與密鑰');return {endpoint,secret}}function show(tab){$('list').classList.toggle('hidden',tab!=='list');$('editor').classList.toggle('hidden',tab!=='editor');$('ledger').classList.toggle('hidden',tab!=='ledger');$('navList').classList.toggle('on',tab!=='ledger'&&!showHistory);$('navHistory').classList.toggle('on',tab!=='ledger'&&showHistory);$('navLedger').classList.toggle('on',tab==='ledger')}function newOrder(){if(busy)return;editingVersion='';fields.forEach(f=>{if($(f))$(f).value=''});$('delivery').value='自取';$('payment').value='未付款';$('status').value='待確認';orderItems=[emptyItem()];renderItems();$('formTitle').textContent='新增訂單';show('editor');window.scrollTo(0,0)}function edit(id){if(busy)return;const o=data.find(x=>x.id===id);if(!o)return;editingVersion=o.updatedAt||'';fields.forEach(f=>$(f).value=o[f]??'');orderItems=(o.items&&o.items.length?o.items:[emptyItem()]).map(x=>({...x}));renderItems();$('formTitle').textContent='編輯訂單';show('editor');window.scrollTo(0,0)}function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const flow={'待確認':['確認訂單','已成立'],'待付款':['確認成立','已成立'],'已成立':['開始製作','製作中'],'製作中':['完成製作','待交付'],'待交付':['已交付','已完成']};let showHistory=false;function isHistory(o){return o.status==='已取消'||(o.status==='已完成'&&(o.payment==='已付款'||o.payment==='已退款'))}function owing(o){return o.status==='已完成'&&(o.payment==='未付款'||o.payment==='部分付款')}let orderItems=[];function emptyItem(){return{product:'',quantity:1,price:0}}function itemAmount(it){return(Number(it.price)||0)*(Number(it.quantity)||0)}function legacyItem(o){const q=Number(o.quantity)||1,a=Number(o.amount)||0;return{product:o.product==null?'':o.product,quantity:q,price:q?Math.round(a/q):a}}function rawItems(o){let it=o&&o.items;if(typeof it==='string'){try{it=JSON.parse(it)}catch(e){return null}}return Array.isArray(it)&&it.length?it.map(x=>{const q=Number(x.quantity)||0,a=Number(x.amount)||0;const pr=(x.price===undefined||x.price===null||x.price==='')?(q?Math.round(a/q):a):(Number(x.price)||0);return{product:String(x.product==null?'':x.product),quantity:q,price:pr}}):null}function recalcItem(i){const el=$('sub'+i);if(el)el.textContent=money(itemAmount(orderItems[i]))}function recalcTotal(){const t=orderItems.reduce((a,x)=>a+itemAmount(x),0);$('orderTotal').textContent=money(t);return t}function renderItems(){$('items').innerHTML=orderItems.map((it,i)=>'<div class="item-block"><div class="item-head"><span>商品 '+(i+1)+'</span>'+(orderItems.length>1?'<button type="button" class="link-del" data-del="'+i+'">刪除</button>':'')+'</div>'+'<label for="itp'+i+'">商品名稱 *</label><input id="itp'+i+'" data-i="'+i+'" data-k="product" value="'+escapeHTML(it.product)+'" required maxlength="200">'+'<div class="row"><div><label for="itq'+i+'">數量 *</label><input id="itq'+i+'" data-i="'+i+'" data-k="quantity" type="number" min="1" step="1" value="'+escapeHTML(it.quantity)+'" required></div>'+'<div><label for="ita'+i+'">單價 NT$ *</label><input id="ita'+i+'" data-i="'+i+'" data-k="price" type="number" min="0" step="1" value="'+escapeHTML(it.price)+'" required></div></div>'+'<div class="sub-row"><span class="muted">小計</span><b id="sub'+i+'">'+money(itemAmount(it))+'</b></div></div>').join('');$('items').querySelectorAll('[data-k]').forEach(el=>{el.oninput=()=>{const i=Number(el.dataset.i),k=el.dataset.k;orderItems[i][k]=k==='product'?el.value:Number(el.value);recalcItem(i);recalcTotal()}});$('items').querySelectorAll('[data-del]').forEach(b=>{b.onclick=()=>{orderItems.splice(Number(b.dataset.del),1);renderItems()}});recalcTotal()}function addItem(){if(busy)return;orderItems.push(emptyItem());renderItems();const e=$('items').querySelectorAll('[data-k="product"]');if(e.length)e[e.length-1].focus()}function normDate(v){if(v==null||v==='')return '';const s=String(v).trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const d=new Date(s);if(isNaN(d.getTime()))return '';const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}function render(){const base=data.filter(o=>showHistory?isHistory(o):!isHistory(o));const filtered=base.filter(o=>!$('filter').value||o.status===$('filter').value).sort(showHistory?((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||''))):((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')));$('listTitle').textContent=showHistory?'歷史訂單':'訂單清單';$('summary').textContent=showHistory?`共 ${filtered.length} 筆歷史訂單（已完成並收款，或已取消）`:`共 ${filtered.length} 筆訂單｜待製作 ${base.filter(o=>['已成立','製作中'].includes(o.status)).length} 筆｜歷史 ${data.filter(isHistory).length} 筆`;$('orders').innerHTML=filtered.length?filtered.map(o=>`<article class="card"><div><b>${escapeHTML(o.customer)}</b> <span class="status">${escapeHTML(o.status)}</span></div><div>${o.hasItems?(o.items||[]).map(it=>escapeHTML(it.product)+' ×'+escapeHTML(it.quantity)).join('、'):escapeHTML(o.product)}</div><div><b>${money(o.amount)}</b></div><div class="muted">${escapeHTML(o.due||'未指定日期')}・${escapeHTML(o.delivery)}・${escapeHTML(o.payment)}</div>${owing(o)?`<div class="warn"><span>⚠️ 已交付，${o.payment==='部分付款'?'款項尚未收齊':'尚未收款'} ${money(o.amount)}</span><button class="pay-btn" data-paid="${escapeHTML(o.id)}">已收款</button></div>`:''}<div class="row" style="margin-top:10px"><button class="secondary" data-edit="${escapeHTML(o.id)}">查看／修改</button>${flow[o.status]?`<button data-next="${escapeHTML(o.id)}">${escapeHTML(flow[o.sta
