<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#9670ae"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><meta name="referrer" content="no-referrer"><title>Timo 烘焙坊｜訂單管理</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#fff8f2;color:#3d302b;margin:0;font-size:18px}header{background:#9670ae;color:white;padding:18px}main{max-width:800px;margin:auto;padding:16px}button,input,select,textarea{font:inherit;padding:12px;border-radius:10px;border:1px solid #c9b7a9;box-sizing:border-box}button{background:#9670ae;color:white;cursor:pointer}button.secondary{background:white;color:#9670ae}input,select,textarea{width:100%;background:white}label{display:block;margin:12px 0 5px;font-weight:600}.card{background:white;border:1px solid #e4d6cc;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #00000008}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}nav{display:flex;gap:8px;margin:16px 0}nav button{flex:1}.muted{color:#74665e;font-size:15px}.hidden{display:none}.status{font-weight:bold;color:#785332}h1{margin:0;font-size:25px}h2{font-size:22px}.danger{background:#a62b2b}small{font-size:14px}
:root{color-scheme:light}*{box-sizing:border-box}body{background:#fcf7fd;color:#493c55}header{position:relative;display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,#ead8f3,#f9deea);color:#513c63;padding:20px 16px;border-bottom:1px solid #dfc5e9}header h1{font-size:24px}header .muted{margin-top:5px;color:#735e80}main{position:relative;max-width:800px;padding:16px}button{background:#8c64a5;border-color:#8c64a5;box-shadow:0 3px 9px #87629b15}button.secondary{background:#fff;color:#75508e;border-color:#d7bfe4}button:disabled{opacity:.55;cursor:wait}input,select,textarea{border-color:#dbc9e4;color:#493c55;min-width:0}input:focus,select:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:3px solid #d4afe7;outline-offset:2px}.card{border-color:#eadbee;border-radius:20px;box-shadow:0 5px 18px #8462930c}.muted{color:#7d6b88}.status{color:#88549e}nav{margin:12px 0 18px}nav button{border-radius:14px}.sync-line{font-size:14px;min-height:22px;margin:10px 2px;color:#786386}.flowers{position:absolute;right:16px;top:12px;color:#ad80bd;font-size:27px;letter-spacing:8px;pointer-events:none;opacity:.6}.flowers span{font-size:17px;color:#cf8fb3}.menu{flex:none}.menu>summary{list-style:none;cursor:pointer;font-size:27px;width:46px;height:46px;display:grid;place-items:center;background:#fff9;border:1px solid #d7bfe4;border-radius:14px}.menu>summary::-webkit-details-marker{display:none}.menu[open]:before{content:'';position:fixed;inset:0;background:#37233d55;z-index:10;pointer-events:none}.settings-panel{position:fixed;inset:0 auto 0 0;width:min(90vw,390px);height:100dvh;overflow:auto;overscroll-behavior:contain;z-index:11;background:#fcf7fd;padding:22px;padding-top:max(22px,env(safe-area-inset-top));box-shadow:8px 0 30px #49345426;color:#493c55}.settings-title{display:flex;justify-content:space-between;align-items:center;gap:12px}.settings-title h2{margin:0}.settings-title button{padding:8px 12px}.settings-panel p{line-height:1.7}.settings-panel .row>*{flex-basis:100%}.intro{font-size:14px;padding:14px;border:1px solid #eadbee;border-radius:16px;background:#fff9;line-height:1.7}.footer-note{font-size:13px;line-height:1.7;margin-top:28px}#summary{font-size:15px;color:#7d6b88}.ledger-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}.ledger-grid .big{display:block;font-size:21px;margin:4px 0;color:#5c3f70}.ledger-grid .big.neg{color:#a62b2b}.warn{margin-top:12px;padding:10px 12px;border-radius:12px;background:#fdf3e4;border:1px solid #efd9b4;font-size:15px;color:#7a5a2e}.drawer-sec{margin:22px 0 0;padding-top:18px;border-top:1px solid #eadbee}.drawer-nav{display:flex;flex-direction:column;gap:10px;margin-top:18px}.drawer-nav button{width:100%;text-align:left;padding:15px 16px;font-size:18px}.drawer-nav button.on{background:#75508e;border-color:#75508e;color:#fff}.login-card{max-width:460px;margin:8px auto}.login-card h2{margin:0 0 6px}.login-card button{width:100%;margin-top:18px}#ledger h3{margin:24px 0 8px}@media(max-width:420px){.ledger-grid{gap:8px}.ledger-grid .big{font-size:18px}}@media(max-width:420px){header h1{font-size:21px}.flowers{right:6px;letter-spacing:2px;font-size:21px}header{gap:10px}.row{gap:8px}main{padding:14px}button,input,select,textarea{font-size:16px}}
</style></head><body><header><details class="menu" id="settingsMenu" hidden><summary aria-label="開啟選單" title="選單">☰</summary><aside class="settings-panel" aria-label="選單"><div class="settings-title"><h2>選單</h2><button class="secondary" onclick="closeSettings()" aria-label="關閉選單">✕</button></div><div class="drawer-nav"><button id="navList" onclick="go('list')">訂單清單</button><button id="navLedger" onclick="go('ledger')">收支紀錄</button></div><div class="drawer-sec"><button class="secondary" style="width:100%" onclick="logout()">登出</button><p class="muted">登出後需重新輸入密鑰。網址會記在這支手機，下次自動帶入。</p></div></aside></details><div><h1>Timo 烘焙坊</h1><div class="muted">把每一份甜蜜，細心記下</div></div><div class="flowers" aria-hidden="true">✿ <span>❀</span></div></header><main><section id="login"><article class="card login-card"><h2>連線設定</h2><p class="muted">輸入 Apps Script 網址與共用密鑰即可開始。網址會記在這支手機，下次只要輸入密鑰。</p><form id="loginForm"><label for="endpoint">Apps Script 網址</label><input id="endpoint" type="url" autocapitalize="none" spellcheck="false" placeholder="https://script.google.com/macros/s/.../exec"><label for="secret">共用密鑰</label><input id="secret" type="password" autocomplete="off" placeholder="請輸入後端設定的密鑰"><button type="submit">登入</button></form><p id="settingsNotice" class="muted" role="status" aria-live="polite"></p><p class="muted">密鑰不會儲存在公開網站，也不會長期保存在手機。</p></article></section><p id="syncMsg" role="status" aria-live="polite" class="sync-line hidden"></p><nav id="mainNav" class="hidden"><button onclick="go('list')">訂單清單</button><button onclick="newOrder()">＋新增訂單</button></nav><section id="list"><div class="row"><select id="filter" onchange="render()"><option value="">全部狀態</option><option>待確認</option><option>待付款</option><option>已成立</option><option>製作中</option><option>待交付</option><option>已完成</option><option>已取消</option></select><button class="secondary" onclick="loadOrders()">重新整理</button></div><p id="summary"></p><div id="orders"></div></section><section id="editor" class="hidden"><h2 id="formTitle">新增訂單</h2><form id="form"><input type="hidden" id="id"><label>顧客名稱 *</label><input id="customer" required maxlength="100"><label>聯絡方式（可留空）</label><input id="contact" maxlength="100"><label>商品名稱 *</label><input id="product" required maxlength="200"><div class="row"><div><label>數量 *</label><input id="quantity" type="number" min="1" step="1" value="1" required></div><div><label>總金額 NT$ *</label><input id="amount" type="number" min="0" step="1" value="0" required></div></div><label>交付日期</label><input id="due" type="date"><label>交付方式</label><select id="delivery"><option>自取</option><option>宅配</option></select><label>付款狀態</label><select id="payment"><option>未付款</option><option>部分付款</option><option>已付款</option><option>已退款</option></select><label>訂單狀態</label><select id="status"><option>待確認</option><option>待付款</option><option>已成立</option><option>製作中</option><option>待交付</option><option>已完成</option><option>已取消</option></select><label>備註／客製化需求</label><textarea id="notes" rows="3" maxlength="2000"></textarea><div class="row" style="margin-top:16px"><button type="submit">儲存訂單</button><button type="button" class="secondary" onclick="show('list')">取消</button></div></form></section><section id="ledger" class="hidden"><h2>收支紀錄</h2><div class="row"><input id="month" type="month" aria-label="記帳月份" onchange="renderLedger()"><button class="secondary" onclick="loadLedger()">重新整理</button></div><p id="ledgerMsg" class="sync-line" role="status" aria-live="polite"></p><div id="ledgerSummary"></div><h3 id="expFormTitle">新增支出</h3><form id="expForm"><input type="hidden" id="expId"><div class="row"><div><label for="expDate">日期 *</label><input id="expDate" type="date" required></div><div><label for="expCategory">分類</label><select id="expCategory"><option>材料</option><option>包材</option><option>設備</option><option>運費</option><option>其他</option></select></div></div><label for="expItem">項目 *</label><input id="expItem" required maxlength="100" placeholder="例：動物性鮮奶油 5 盒"><label for="expAmount">金額 NT$ *</label><input id="expAmount" type="number" min="0" step="1" required><label for="expNotes">備註</label><input id="expNotes" maxlength="500"><div class="row" style="margin-top:14px"><button type="submit">儲存支出</button><button type="button" class="secondary" onclick="resetExpForm()">清空欄位</button></div></form><h3>本月支出明細</h3><div id="expList"></div><h3>本月待收款</h3><div id="unpaidList"></div><div class="row" style="margin-top:22px"><button class="secondary" onclick="show('list')">回訂單清單</button></div></section><p id="footerNote" class="muted footer-note hidden">❀ 兩人一起照顧每一份訂單。另一支手機修改後，請按「重新整理」。</p></main><script>let data=[],busy=false,editingVersion='';const fields=['id','customer','contact','product','quantity','amount','due','delivery','payment','status','notes'];const $=x=>document.getElementById(x);let storageAvailable=true,loggedIn=false;try{$('endpoint').value=localStorage.getItem('timoEndpoint')||'';localStorage.removeItem('timoSecret');sessionStorage.removeItem('timoSecret')}catch{storageAvailable=false}$('secret').value='';
function closeSettings(){$('settingsMenu').open=false}
function setAuth(v){loggedIn=v;$('settingsMenu').hidden=!v;if(!v)$('settingsMenu').open=false;$('login').classList.toggle('hidden',v);['syncMsg','mainNav','footerNote'].forEach(id=>$(id).classList.toggle('hidden',!v));if(!v)['list','editor','ledger'].forEach(id=>$(id).classList.add('hidden'))}function go(tab){if(busy)return;closeSettings();show(tab);window.scrollTo(0,0);if(tab==='ledger')openLedger()}async function login(){if(busy)return;try{config()}catch(e){$('settingsNotice').textContent=e.message;return}try{localStorage.setItem('timoEndpoint',$('endpoint').value.trim());storageAvailable=true}catch{storageAvailable=false}setBusy(true);$('settingsNotice').textContent='連線中…';try{await refreshOrders();setAuth(true);show('list');$('settingsNotice').textContent=storageAvailable?'':'瀏覽器禁止保存設定，下次仍需輸入網址。'}catch(e){$('settingsNotice').textContent='登入失敗：'+e.message}finally{setBusy(false)}}
function logout(){if(busy)return;data=[];expenses=[];backendLedger=null;editingVersion='';$('secret').value='';$('form').reset();$('expForm').reset();render();closeSettings();setAuth(false);$('settingsNotice').textContent='已登出，請重新輸入密鑰。';window.scrollTo(0,0)}function config(){const endpoint=$('endpoint').value.trim(),secret=$('secret').value;if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(endpoint)||!secret)throw Error('請填入正確 Apps Script 網址與密鑰');return {endpoint,secret}}function show(tab){$('list').classList.toggle('hidden',tab!=='list');$('editor').classList.toggle('hidden',tab!=='editor');$('ledger').classList.toggle('hidden',tab!=='ledger');$('navList').classList.toggle('on',tab!=='ledger');$('navLedger').classList.toggle('on',tab==='ledger')}function newOrder(){if(busy)return;editingVersion='';fields.forEach(f=>{if($(f))$(f).value=''});$('quantity').value=1;$('amount').value=0;$('delivery').value='自取';$('payment').value='未付款';$('status').value='待確認';$('formTitle').textContent='新增訂單';show('editor')}function edit(id){if(busy)return;const o=data.find(x=>x.id===id);if(!o)return;editingVersion=o.updatedAt||'';fields.forEach(f=>$(f).value=o[f]??'');$('formTitle').textContent='編輯訂單';show('editor');window.scrollTo(0,0)}function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function normDate(v){if(v==null||v==='')return '';const s=String(v).trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const d=new Date(s);if(isNaN(d.getTime()))return '';const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}function render(){const filtered=data.filter(o=>!$('filter').value||o.status===$('filter').value).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));$('summary').textContent=`共 ${filtered.length} 筆訂單｜待製作 ${data.filter(o=>['已成立','製作中'].includes(o.status)).length} 筆`;$('orders').innerHTML=filtered.length?filtered.map(o=>`<article class="card"><div><b>${escapeHTML(o.customer)}</b> <span class="status">${escapeHTML(o.status)}</span></div><div>${escapeHTML(o.product)} × ${escapeHTML(o.quantity)}｜NT$ ${escapeHTML(o.amount)}</div><div class="muted">${escapeHTML(o.due||'未指定日期')}・${escapeHTML(o.delivery)}・${escapeHTML(o.payment)}</div><div class="row" style="margin-top:10px"><button class="secondary" data-edit="${escapeHTML(o.id)}">查看／修改</button>${o.status==='製作中'?`<button data-done="${escapeHTML(o.id)}">完成製作</button>`:''}</div></article>`).join(''):'<p>目前沒有符合條件的訂單。</p>';$('orders').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));$('orders').querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>updateStatus(b.dataset.done,'待交付'))}function setBusy(value){busy=value;document.querySelectorAll('button,input,select,textarea').forEach(el=>el.disabled=value)}
async function request(payload){const {endpoint,secret}=config();const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),30000);try{const res=await fetch(endpoint,{method:'POST',mode:'cors',credentials:'omit',redirect:'follow',referrerPolicy:'no-referrer',cache:'no-store',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...payload,secret}),signal:controller.signal});if(!res.ok)throw Error('HTTP '+res.status);let obj;try{obj=await res.json()}catch{throw Error('後端未回傳 JSON，請檢查部署權限與 /exec 網址')}if(!obj.ok)throw Error(obj.error||'伺服器回應失敗');if(obj.apiVersion!==2)throw Error('請先將後端更新至本次發布版，再重新部署');return obj}catch(e){if(e.name==='AbortError'||e instanceof TypeError)throw Error('連線逾時或受瀏覽器限制；儲存結果可能未確認。請先同步查看，勿直接重複新增');throw e}finally{clearTimeout(timer)}}
async function refreshOrders(){const result=await request({action:'list'});if(!Array.isArray(result.orders))throw Error('訂單格式錯誤');data=result.orders.map(o=>({...o,due:normDate(o.due)}));render();$('syncMsg').textContent='已同步 '+new Date().toLocaleTimeString('zh-TW')}
async function loadOrders(){if(busy||!loggedIn)return;setBusy(true);$('syncMsg').textContent='同步中…';try{await refreshOrders()}catch(e){$('syncMsg').textContent='同步失敗，畫面可能是舊資料：'+e.message}finally{setBusy(false)}}
async function saveOrder(order){if(busy)return;setBusy(true);$('syncMsg').textContent='儲存中…';try{const result=await request({action:'save',order});if($('id').value===order.id)editingVersion=result.updatedAt;show('list');try{await refreshOrders()}catch(e){$('syncMsg').textContent='訂單已儲存，但清單更新失敗，請重新同步：'+e.message}}catch(e){$('syncMsg').textContent='儲存未完成確認：'+e.message;alert(e.message)}finally{setBusy(false)}}
async function updateStatus(id,status){const o=data.find(x=>x.id===id);if(o)await saveOrder({...o,status})}
$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;const order={};fields.forEach(f=>order[f]=$(f).value);order.quantity=Number(order.quantity);order.amount=Number(order.amount);if(!order.id){order.id=crypto.randomUUID();$('id').value=order.id}order.updatedAt=editingVersion;await saveOrder(order)};
let expenses=[],backendLedger=null;
function money(n){return 'NT$ '+Number(n||0).toLocaleString('zh-TW')}
function monthKey(v){return String(v||'').slice(0,7)}
function thisMonth(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)}
function today(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function resetExpForm(){$('expForm').reset();$('expId').value='';$('expDate').value=today();$('expFormTitle').textContent='新增支出'}
function openLedger(){if(!$('month').value)$('month').value=thisMonth();if(!$('expDate').value)$('expDate').value=today();loadLedger()}
function editExpense(id){if(busy)return;const e=expenses.find(x=>x.id===id);if(!e)return;$('expId').value=e.id;$('expDate').value=normDate(e.date);$('expCategory').value=e.category||'其他';$('expItem').value=e.item??'';$('expAmount').value=e.amount??'';$('expNotes').value=e.notes??'';$('expFormTitle').textContent='修改支出';window.scrollTo(0,0)}
async function loadLedger(){if(busy||!loggedIn)return;setBusy(true);$('ledgerMsg').textContent='讀取中…';try{await refreshOrders();try{const r=await request({action:'listExpenses'});expenses=Array.isArray(r.expenses)?r.expenses.map(e=>({...e,date:normDate(e.date)})):[];backendLedger=true;$('ledgerMsg').textContent='已同步 '+new Date().toLocaleTimeString('zh-TW')}catch(err){backendLedger=false;expenses=[];$('ledgerMsg').textContent='後端尚未支援收支紀錄，目前只顯示訂單營收。請先依 Code-收支紀錄擴充.gs 更新後端。'}renderLedger()}catch(e){$('ledgerMsg').textContent='讀取失敗：'+e.message}finally{setBusy(false)}}
function renderLedger(){const m=$('month').value;if(!m){$('ledgerSummary').innerHTML='<p class="muted">請先選擇月份。</p>';$('expList').innerHTML='';$('unpaidList').innerHTML='';return}
const live=data.filter(o=>o.status!=='已取消'&&monthKey(o.due||o.updatedAt)===m);
const paid=live.filter(o=>o.payment==='已付款'),partial=live.filter(o=>o.payment==='部分付款'),unpaid=live.filter(o=>o.payment==='未付款');
const rev=paid.reduce((t,o)=>t+(Number(o.amount)||0),0),owed=unpaid.reduce((t,o)=>t+(Number(o.amount)||0),0);
const exps=expenses.filter(e=>monthKey(e.date)===m).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
const cost=exps.reduce((t,e)=>t+(Number(e.amount)||0),0),profit=rev-cost;
const byCat={};exps.forEach(e=>{const k=e.category||'其他';byCat[k]=(byCat[k]||0)+(Number(e.amount)||0)});
$('ledgerSummary').innerHTML='<article class="card"><div class="ledger-grid">'
+'<div><div class="muted">已收營收</div><b class="big">'+money(rev)+'</b><div class="muted">'+paid.length+' 筆</div></div>'
+'<div><div class="muted">支出</div><b class="big">'+money(cost)+'</b><div class="muted">'+exps.length+' 筆</div></div>'
+'<div><div class="muted">毛利</div><b class="big'+(profit<0?' neg':'')+'">'+money(profit)+'</b><div class="muted">營收 − 支出</div></div></div>'
+(Object.keys(byCat).length?'<div class="muted" style="margin-top:14px">支出分類：'+Object.entries(byCat).map(x=>escapeHTML(x[0])+' '+money(x[1])).join('｜')+'</div>':'')
+(owed?'<div class="warn">尚有 '+unpaid.length+' 筆未收款，共 '+money(owed)+'，未計入營收。</div>':'')
+(partial.length?'<div class="warn">'+partial.length+' 筆標記為「部分付款」，實收金額不明，未計入營收。</div>':'')
+(backendLedger===false?'<div class="warn">後端尚未支援收支紀錄，支出無法儲存。</div>':'')
+'<p class="muted" style="margin:14px 0 0">營收只計「已付款」訂單。歸月依交付日期；未填交付日期者改以最後更新日期歸月。</p></article>';
$('expList').innerHTML=exps.length?exps.map(e=>'<article class="card"><div><b>'+escapeHTML(e.item)+'</b> <span class="status">'+escapeHTML(e.category||'其他')+'</span></div><div>'+money(e.amount)+'</div><div class="muted">'+escapeHTML(e.date||'未填日期')+(e.notes?'・'+escapeHTML(e.notes):'')+'</div><div class="row" style="margin-top:10px"><button class="secondary" data-exp="'+escapeHTML(e.id)+'">修改</button></div></article>').join(''):'<p class="muted">'+(backendLedger===false?'後端尚未支援收支紀錄。':'本月沒有支出紀錄。')+'</p>';
$('expList').querySelectorAll('[data-exp]').forEach(b=>b.onclick=()=>editExpense(b.dataset.exp));
$('unpaidList').innerHTML=unpaid.length?unpaid.map(o=>'<article class="card"><div><b>'+escapeHTML(o.customer)+'</b> <span class="status">'+escapeHTML(o.status)+'</span></div><div>'+escapeHTML(o.product)+' × '+escapeHTML(o.quantity)+'｜'+money(o.amount)+'</div><div class="muted">'+escapeHTML(o.due||'未指定日期')+'・'+escapeHTML(o.delivery)+'</div></article>').join(''):'<p class="muted">本月沒有待收款訂單。</p>';}
