<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#795548"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><meta name="referrer" content="no-referrer"><title>Timo 烘焙坊｜訂單管理</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#fff8f2;color:#3d302b;margin:0;font-size:18px}header{background:#795548;color:white;padding:18px}main{max-width:800px;margin:auto;padding:16px}button,input,select,textarea{font:inherit;padding:12px;border-radius:10px;border:1px solid #c9b7a9;box-sizing:border-box}button{background:#795548;color:white;cursor:pointer}button.secondary{background:white;color:#795548}input,select,textarea{width:100%;background:white}label{display:block;margin:12px 0 5px;font-weight:600}.card{background:white;border:1px solid #e4d6cc;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #00000008}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}nav{display:flex;gap:8px;margin:16px 0}nav button{flex:1}.muted{color:#74665e;font-size:15px}.hidden{display:none}.status{font-weight:bold;color:#785332}h1{margin:0;font-size:25px}h2{font-size:22px}.danger{background:#a62b2b}small{font-size:14px}</style></head><body><header><h1>🍰 Timo 烘焙坊</h1><div>雙人訂單管理・發布測試版</div></header><main><div class="card" id="setup"><b>同步設定</b><p class="muted">第一次使用，請貼上已部署的 Google Apps Script 網址。兩支手機使用同一網址與共用密鑰即可同步。密鑰只保留在目前頁面記憶體，重新開啟需再輸入。請勿分享密鑰。</p><label>Apps Script 網址</label><input id="endpoint" placeholder="https://script.google.com/macros/s/.../exec"><label>共用密鑰</label><input id="secret" type="password" autocomplete="off" placeholder="請輸入後端設定的密鑰"><div class="row" style="margin-top:12px"><button onclick="saveSettings()">儲存設定</button><button class="secondary" onclick="loadOrders()">同步訂單</button></div><button class="secondary" onclick="lockApp()" style="margin-top:12px">鎖定並清除畫面</button><p id="syncMsg" role="status" aria-live="polite" class="muted"></p></div><nav><button onclick="show('list')">訂單清單</button><button onclick="newOrder()">＋新增訂單</button></nav><section id="list"><div class="row"><select id="filter" onchange="render()"><option value="">全部狀態</option><option>待確認</option><option>待付款</option><option>已成立</option><option>製作中</option><option>待交付</option><option>已完成</option><option>已取消</option></select><button class="secondary" onclick="loadOrders()">重新整理</button></div><p id="summary"></p><div id="orders"></div></section><section id="editor" class="hidden"><h2 id="formTitle">新增訂單</h2><form id="form"><input type="hidden" id="id"><label>顧客名稱 *</label><input id="customer" required maxlength="100"><label>聯絡方式（可留空）</label><input id="contact" maxlength="100"><label>商品名稱 *</label><input id="product" required maxlength="200"><div class="row"><div><label>數量 *</label><input id="quantity" type="number" min="1" step="1" value="1" required></div><div><label>總金額 NT$ *</label><input id="amount" type="number" min="0" step="1" value="0" required></div></div><label>交付日期</label><input id="due" type="date"><label>交付方式</label><select id="delivery"><option>自取</option><option>宅配</option></select><label>付款狀態</label><select id="payment"><option>未付款</option><option>部分付款</option><option>已付款</option><option>已退款</option></select><label>訂單狀態</label><select id="status"><option>待確認</option><option>待付款</option><option>已成立</option><option>製作中</option><option>待交付</option><option>已完成</option><option>已取消</option></select><label>備註／客製化需求</label><textarea id="notes" rows="3" maxlength="2000"></textarea><div class="row" style="margin-top:16px"><button type="submit">儲存訂單</button><button type="button" class="secondary" onclick="show('list')">取消</button></div></form></section><p class="muted">提醒：此版本使用共用密鑰，不是個人帳號登入。請勿公開部署連結；正式儲存顧客個資前，應設定適當的存取權限與備份。</p></main><script>let data=[],busy=false,editingVersion='';const fields=['id','customer','contact','product','quantity','amount','due','delivery','payment','status','notes'];const $=x=>document.getElementById(x);$('endpoint').value=localStorage.getItem('timoEndpoint')||'';localStorage.removeItem('timoSecret');sessionStorage.removeItem('timoSecret');$('secret').value='';function saveSettings(){localStorage.setItem('timoEndpoint',$('endpoint').value.trim());data=[];render();show('list');$('syncMsg').textContent='設定已儲存，請按同步訂單';}function lockApp(){if(busy)return;data=[];editingVersion='';$('secret').value='';$('form').reset();render();show('list');$('syncMsg').textContent='已鎖定，請重新輸入密鑰並同步';}function config(){const endpoint=$('endpoint').value.trim(),secret=$('secret').value;if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(endpoint)||!secret)throw Error('請填入正確 Apps Script 網址與密鑰');return {endpoint,secret}}function show(tab){$('list').classList.toggle('hidden',tab!=='list');$('editor').classList.toggle('hidden',tab!=='editor')}function newOrder(){if(busy)return;editingVersion='';fields.forEach(f=>{if($(f))$(f).value=''});$('quantity').value=1;$('amount').value=0;$('delivery').value='自取';$('payment').value='未付款';$('status').value='待確認';$('formTitle').textContent='新增訂單';show('editor')}function edit(id){if(busy)return;const o=data.find(x=>x.id===id);if(!o)return;editingVersion=o.updatedAt||'';fields.forEach(f=>$(f).value=o[f]??'');$('formTitle').textContent='編輯訂單';show('editor');window.scrollTo(0,0)}function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const filtered=data.filter(o=>!$('filter').value||o.status===$('filter').value).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));$('summary').textContent=`共 ${filtered.length} 筆訂單｜待製作 ${data.filter(o=>['已成立','製作中'].includes(o.status)).length} 筆`;$('orders').innerHTML=filtered.length?filtered.map(o=>`<article class="card"><div><b>${escapeHTML(o.customer)}</b> <span class="status">${escapeHTML(o.status)}</span></div><div>${escapeHTML(o.product)} × ${escapeHTML(o.quantity)}｜NT$ ${escapeHTML(o.amount)}</div><div class="muted">${escapeHTML(o.due||'未指定日期')}・${escapeHTML(o.delivery)}・${escapeHTML(o.payment)}</div><div class="row" style="margin-top:10px"><button class="secondary" data-edit="${escapeHTML(o.id)}">查看／修改</button>${o.status==='製作中'?`<button data-done="${escapeHTML(o.id)}">完成製作</button>`:''}</div></article>`).join(''):'<p>目前沒有符合條件的訂單。</p>';$('orders').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));$('orders').querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>updateStatus(b.dataset.done,'待交付'))}function setBusy(value){busy=value;document.querySelectorAll('button,input,select,textarea').forEach(el=>el.disabled=value)}
async function request(payload){const {endpoint,secret}=config();const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),30000);try{const res=await fetch(endpoint,{method:'POST',mode:'cors',credentials:'omit',redirect:'follow',referrerPolicy:'no-referrer',cache:'no-store',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...payload,secret}),signal:controller.signal});if(!res.ok)throw Error('HTTP '+res.status);let obj;try{obj=await res.json()}catch{throw Error('後端未回傳 JSON，請檢查部署權限與 /exec 網址')}if(!obj.ok)throw Error(obj.error||'伺服器回應失敗');if(obj.apiVersion!==2)throw Error('請先將後端更新至本次發布版，再重新部署');return obj}catch(e){if(e.name==='AbortError'||e instanceof TypeError)throw Error('連線逾時或受瀏覽器限制；儲存結果可能未確認。請先同步查看，勿直接重複新增');throw e}finally{clearTimeout(timer)}}
async function refreshOrders(){const result=await request({action:'list'});if(!Array.isArray(result.orders))throw Error('訂單格式錯誤');data=result.orders;render();$('syncMsg').textContent='已同步 '+new Date().toLocaleTimeString('zh-TW')}
async function loadOrders(){if(busy)return;setBusy(true);$('syncMsg').textContent='同步中…';try{await refreshOrders()}catch(e){$('syncMsg').textContent='同步失敗，畫面可能是舊資料：'+e.message}finally{setBusy(false)}}
async function saveOrder(order){if(busy)return;setBusy(true);$('syncMsg').textContent='儲存中…';try{const result=await request({action:'save',order});if($('id').value===order.id)editingVersion=result.updatedAt;show('list');try{await refreshOrders()}catch(e){$('syncMsg').textContent='訂單已儲存，但清單更新失敗，請重新同步：'+e.message}}catch(e){$('syncMsg').textContent='儲存未完成確認：'+e.message;alert(e.message)}finally{setBusy(false)}}
async function updateStatus(id,status){const o=data.find(x=>x.id===id);if(o)await saveOrder({...o,status})}
$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;const order={};fields.forEach(f=>order[f]=$(f).value);order.quantity=Number(order.quantity);order.amount=Number(order.amount);if(!order.id){order.id=crypto.randomUUID();$('id').value=order.id}order.updatedAt=editingVersion;await saveOrder(order)};render();</script></body></html>
