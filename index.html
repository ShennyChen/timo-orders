<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#9670ae"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><meta name="referrer" content="no-referrer"><title>Timo 烘焙坊｜訂單管理</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#fff8f2;color:#3d302b;margin:0;font-size:18px}header{background:#9670ae;color:white;padding:18px}main{max-width:800px;margin:auto;padding:16px}button,input,select,textarea{font:inherit;padding:12px;border-radius:10px;border:1px solid #c9b7a9;box-sizing:border-box}button{background:#9670ae;color:white;cursor:pointer}button.secondary{background:white;color:#9670ae}input,select,textarea{width:100%;background:white}label{display:block;margin:12px 0 5px;font-weight:600}.card{background:white;border:1px solid #e4d6cc;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #00000008}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}nav{display:flex;gap:8px;margin:16px 0}nav button{flex:1}.muted{color:#74665e;font-size:15px}.hidden{display:none}.status{font-weight:bold;color:#785332}h1{margin:0;font-size:25px}h2{font-size:22px}.danger{background:#a62b2b}small{font-size:14px}
:root{color-scheme:light}*{box-sizing:border-box}body{background:#fcf7fd;color:#493c55}header{position:relative;display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,#ead8f3,#f9deea);color:#513c63;padding:20px 16px;border-bottom:1px solid #dfc5e9}header h1{font-size:24px}header .muted{margin-top:5px;color:#735e80}main{position:relative;max-width:800px;padding:16px}button{background:#8c64a5;border-color:#8c64a5;box-shadow:0 3px 9px #87629b15}button.secondary{background:#fff;color:#75508e;border-color:#d7bfe4}button:disabled{opacity:.55;cursor:wait}input,select,textarea{border-color:#dbc9e4;color:#493c55;min-width:0}input:focus,select:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:3px solid #d4afe7;outline-offset:2px}.card{border-color:#eadbee;border-radius:20px;box-shadow:0 5px 18px #8462930c}.muted{color:#7d6b88}.status{color:#88549e}nav{margin:12px 0 18px}nav button{border-radius:14px}.sync-line{font-size:14px;min-height:22px;margin:10px 2px;color:#786386}.flowers{position:absolute;right:16px;top:12px;color:#ad80bd;font-size:27px;letter-spacing:8px;pointer-events:none;opacity:.6}.flowers span{font-size:17px;color:#cf8fb3}.menu{flex:none}.menu>summary{list-style:none;cursor:pointer;font-size:27px;width:46px;height:46px;display:grid;place-items:center;background:#fff9;border:1px solid #d7bfe4;border-radius:14px}.menu>summary::-webkit-details-marker{display:none}.menu[open]:before{content:'';position:fixed;inset:0;background:#37233d55;z-index:10;pointer-events:none}.settings-panel{position:fixed;inset:0 auto 0 0;width:min(90vw,390px);height:100dvh;overflow:auto;overscroll-behavior:contain;z-index:11;background:#fcf7fd;padding:22px;padding-top:max(22px,env(safe-area-inset-top));box-shadow:8px 0 30px #49345426;color:#493c55}.settings-title{display:flex;justify-content:space-between;align-items:center;gap:12px}.settings-title h2{margin:0}.settings-title button{padding:8px 12px}.settings-panel p{line-height:1.7}.settings-panel .row>*{flex-basis:100%}.intro{font-size:14px;padding:14px;border:1px solid #eadbee;border-radius:16px;background:#fff9;line-height:1.7}.footer-note{font-size:13px;line-height:1.7;margin-top:28px}#summary{font-size:15px;color:#7d6b88}@media(max-width:420px){header h1{font-size:21px}.flowers{right:6px;letter-spacing:2px;font-size:21px}header{gap:10px}.row{gap:8px}main{padding:14px}button,input,select,textarea{font-size:16px}}
</style></head><body><header><details class="menu" id="settingsMenu"><summary aria-label="開啟同步設定選單" title="同步設定">☰</summary><aside class="settings-panel" aria-label="同步設定"><div class="settings-title"><h2>同步設定</h2><button class="secondary" onclick="closeSettings()" aria-label="關閉同步設定">✕</button></div><p class="muted">兩支手機第一次各設定一次。網址會記在各自手機，下次自動帶入；密鑰重新開啟時需再輸入。</p><label for="endpoint">Apps Script 網址</label><input id="endpoint" type="url" autocapitalize="none" spellcheck="false" placeholder="https://script.google.com/macros/s/.../exec"><p class="muted">網址會自動記住，不用每次貼上。</p><label for="secret">共用密鑰</label><input id="secret" type="password" autocomplete="off" placeholder="請輸入後端設定的密鑰"><div class="row" style="margin-top:18px"><button onclick="saveSettings()">儲存並同步</button><button class="secondary" onclick="lockApp()">鎖定並清除畫面</button></div><p id="settingsNotice" class="muted" role="status"></p><p class="muted">密鑰不會儲存在公開網站，也不會長期保存在手機。</p></aside></details><div><h1>Timo 烘焙坊</h1><div class="muted">把每一份甜蜜，細心記下</div></div><div class="flowers" aria-hidden="true">✿ <span>❀</span></div></header><main><p id="syncMsg" role="status" aria-live="polite" class="sync-line">點左上角 ☰ 設定同步，開始今天的訂單。</p><div id="firstUse" class="intro" hidden>❀ 第一次使用？點左上角 ☰ 輸入同步設定。設定好後，這裡就是你的訂單清單。</div><nav><button onclick="show('list')">訂單清單</button><button onclick="newOrder()">＋新增訂單</button></nav><section id="list"><div class="row"><select id="filter" onchange="render()"><option value="">全部狀態</option><option>待確認</option><option>待付款</option><option>已成立</option><option>製作中</option><option>待交付</option><option>已完成</option><option>已取消</option></select><button class="secondary" onclick="loadOrders()">重新整理</button></div><p id="summary"></p><div id="orders"></div></section><section id="editor" class="hidden"><h2 id="formTitle">新增訂單</h2><form id="form"><input type="hidden" id="id"><label>顧客名稱 *</label><input id="customer" required maxlength="100"><label>聯絡方式（可留空）</label><input id="contact" maxlength="100"><label>商品名稱 *</label><input id="product" required maxlength="200"><div class="row"><div><label>數量 *</label><input id="quantity" type="number" min="1" step="1" value="1" required></div><div><label>總金額 NT$ *</label><input id="amount" type="number" min="0" step="1" value="0" required></div></div><label>交付日期</label><input id="due" type="date"><label>交付方式</label><select id="delivery"><option>自取</option><option>宅配</option></select><label>付款狀態</label><select id="payment"><option>未付款</option><option>部分付款</option><option>已付款</option><option>已退款</option></select><label>訂單狀態</label><select id="status"><option>待確認</option><option>待付款</option><option>已成立</option><option>製作中</option><option>待交付</option><option>已完成</option><option>已取消</option></select><label>備註／客製化需求</label><textarea id="notes" rows="3" maxlength="2000"></textarea><div class="row" style="margin-top:16px"><button type="submit">儲存訂單</button><button type="button" class="secondary" onclick="show('list')">取消</button></div></form></section><p class="muted footer-note">❀ 兩人一起照顧每一份訂單。另一支手機修改後，請按「重新整理」。</p></main><script>let data=[],busy=false,editingVersion='';const fields=['id','customer','contact','product','quantity','amount','due','delivery','payment','status','notes'];const $=x=>document.getElementById(x);let storageAvailable=true;try{$('endpoint').value=localStorage.getItem('timoEndpoint')||'';localStorage.removeItem('timoSecret');sessionStorage.removeItem('timoSecret')}catch{storageAvailable=false}$('secret').value='';$('firstUse').hidden=!!$('endpoint').value;if($('endpoint').value)$('syncMsg').textContent='網址已帶入，點左上角 ☰ 輸入密鑰即可同步。';
function closeSettings(){$('settingsMenu').open=false}
function saveSettings(){if(busy)return;try{config()}catch(e){$('settingsNotice').textContent=e.message;return}try{localStorage.setItem('timoEndpoint',$('endpoint').value.trim());storageAvailable=true}catch{storageAvailable=false}$('settingsNotice').textContent=storageAvailable?'網址已記住。':'瀏覽器禁止保存設定；下次仍需輸入網址，請改用一般瀏覽模式。';data=[];render();show('list');$('firstUse').hidden=true;if(storageAvailable)closeSettings();loadOrders()}
function lockApp(){if(busy)return;data=[];editingVersion='';$('secret').value='';$('form').reset();render();show('list');closeSettings();$('syncMsg').textContent='已鎖定，點左上角 ☰ 輸入密鑰即可同步。';}function config(){const endpoint=$('endpoint').value.trim(),secret=$('secret').value;if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(endpoint)||!secret)throw Error('請填入正確 Apps Script 網址與密鑰');return {endpoint,secret}}function show(tab){$('list').classList.toggle('hidden',tab!=='list');$('editor').classList.toggle('hidden',tab!=='editor')}function newOrder(){if(busy)return;editingVersion='';fields.forEach(f=>{if($(f))$(f).value=''});$('quantity').value=1;$('amount').value=0;$('delivery').value='自取';$('payment').value='未付款';$('status').value='待確認';$('formTitle').textContent='新增訂單';show('editor')}function edit(id){if(busy)return;const o=data.find(x=>x.id===id);if(!o)return;editingVersion=o.updatedAt||'';fields.forEach(f=>$(f).value=o[f]??'');$('formTitle').textContent='編輯訂單';show('editor');window.scrollTo(0,0)}function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function normDate(v){if(v==null||v==='')return '';const s=String(v).trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const d=new Date(s);if(isNaN(d.getTime()))return '';const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}function render(){const filtered=data.filter(o=>!$('filter').value||o.status===$('filter').value).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));$('summary').textContent=`共 ${filtered.length} 筆訂單｜待製作 ${data.filter(o=>['已成立','製作中'].includes(o.status)).length} 筆`;$('orders').innerHTML=filtered.length?filtered.map(o=>`<article class="card"><div><b>${escapeHTML(o.customer)}</b> <span class="status">${escapeHTML(o.status)}</span></div><div>${escapeHTML(o.product)} × ${escapeHTML(o.quantity)}｜NT$ ${escapeHTML(o.amount)}</div><div class="muted">${escapeHTML(o.due||'未指定日期')}・${escapeHTML(o.delivery)}・${escapeHTML(o.payment)}</div><div class="row" style="margin-top:10px"><button class="secondary" data-edit="${escapeHTML(o.id)}">查看／修改</button>${o.status==='製作中'?`<button data-done="${escapeHTML(o.id)}">完成製作</button>`:''}</div></article>`).join(''):'<p>目前沒有符合條件的訂單。</p>';$('orders').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));$('orders').querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>updateStatus(b.dataset.done,'待交付'))}function setBusy(value){busy=value;document.querySelectorAll('button,input,select,textarea').forEach(el=>el.disabled=value)}
async function request(payload){const {endpoint,secret}=config();const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),30000);try{const res=await fetch(endpoint,{method:'POST',mode:'cors',credentials:'omit',redirect:'follow',referrerPolicy:'no-referrer',cache:'no-store',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...payload,secret}),signal:controller.signal});if(!res.ok)throw Error('HTTP '+res.status);let obj;try{obj=await res.json()}catch{throw Error('後端未回傳 JSON，請檢查部署權限與 /exec 網址')}if(!obj.ok)throw Error(obj.error||'伺服器回應失敗');if(obj.apiVersion!==2)throw Error('請先將後端更新至本次發布版，再重新部署');return obj}catch(e){if(e.name==='AbortError'||e instanceof TypeError)throw Error('連線逾時或受瀏覽器限制；儲存結果可能未確認。請先同步查看，勿直接重複新增');throw e}finally{clearTimeout(timer)}}
async function refreshOrders(){const result=await request({action:'list'});if(!Array.isArray(result.orders))throw Error('訂單格式錯誤');data=result.orders.map(o=>({...o,due:normDate(o.due)}));render();$('syncMsg').textContent='已同步 '+new Date().toLocaleTimeString('zh-TW')}
async function loadOrders(){if(busy)return;if(!$('endpoint').value||!$('secret').value){$('settingsMenu').open=true;$('settingsNotice').textContent='請輸入網址及密鑰，再按儲存並同步。';return}setBusy(true);$('syncMsg').textContent='同步中…';try{await refreshOrders()}catch(e){$('syncMsg').textContent='同步失敗，畫面可能是舊資料：'+e.message}finally{setBusy(false)}}
async function saveOrder(order){if(busy)return;setBusy(true);$('syncMsg').textContent='儲存中…';try{const result=await request({action:'save',order});if($('id').value===order.id)editingVersion=result.updatedAt;show('list');try{await refreshOrders()}catch(e){$('syncMsg').textContent='訂單已儲存，但清單更新失敗，請重新同步：'+e.message}}catch(e){$('syncMsg').textContent='儲存未完成確認：'+e.message;alert(e.message)}finally{setBusy(false)}}
async function updateStatus(id,status){const o=data.find(x=>x.id===id);if(o)await saveOrder({...o,status})}
$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;const order={};fields.forEach(f=>order[f]=$(f).value);order.quantity=Number(order.quantity);order.amount=Number(order.amount);if(!order.id){order.id=crypto.randomUUID();$('id').value=order.id}order.updatedAt=editingVersion;await saveOrder(order)};render();</script></body></html>
